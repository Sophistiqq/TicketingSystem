services:
  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/ticketing.db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Manila}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "3002:3000"
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  sqlite_data:
  uploads:
