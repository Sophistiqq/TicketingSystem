services:
  web:
    build:
      context: ./Frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/ticketing.db
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      APP_BASE_PATH: ${VITE_BASE_PATH:-/}
      TZ: ${TZ:-Asia/Manila}
      VAPID_CONTACT: ${VAPID_CONTACT:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    volumes:
      - sqlite_data:/app/data
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "const base = process.env.APP_BASE_PATH.replace(/[/]$/, ''); const r = await fetch('http://localhost:3000' + base + '/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  sqlite_data:
  uploads:
