# docker compose -f docker-compose.yml -f compose.caddy.yml up -d --build --remove-orphans
services:
  web:
    ports: !reset []
    build:
      args:
        VITE_BASE_PATH: /ticketing/
        FRONTEND_URL: https://192.168.0.254
    environment:
      APP_BASE_PATH: /ticketing/
    networks:
      proxy:
        aliases:
          - ticketing-web

networks:
  proxy:
    external: true
