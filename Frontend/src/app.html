<!doctype html>
<html lang="en" data-theme="ticketing-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Internal Ticketing System — Submit and track IT support requests" />
    <title>Ticketing System</title>
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'ticketing-light');
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
